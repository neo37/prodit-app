function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => { const v = T[l][e.dataset.t]; if (v !== undefined) e.innerHTML = v; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  try { localStorage.setItem('pit.lang', l); } catch (e) {}
}

(async function () {
  const box = document.getElementById('bl');
  const esc = t => t.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  try {
    const d = await (await fetch('/prodit/video_api.php?action=prodit_backlog')).json();
    const items = (d.items || []).slice().reverse();
    if (!items.length) { box.innerHTML = '<p class="note">' + T[document.documentElement.lang].bl_empty + '</p>'; return; }
    box.innerHTML = items.map(m => '<div style="border-bottom:1px solid var(--line);padding-bottom:12px"><div style="font-size:13px;color:var(--sub)">'
      + esc(m.name) + ' · ' + new Date(m.ts).toLocaleDateString() + '</div><div style="white-space:pre-wrap;color:var(--ink)">' + esc(m.text) + '</div></div>').join('');
  } catch (e) { box.innerHTML = '<p class="note">—</p>'; }
})();
